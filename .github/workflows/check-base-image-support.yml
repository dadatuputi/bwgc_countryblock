name: Check base image support window

# The Dockerfile pins an Alpine branch rather than :latest. This opens an issue
# when that branch is within 180 days of leaving support, and fails once it
# has. The check lives in dadatuputi/bwgc_workflows.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  check-support:
    uses: dadatuputi/bwgc_workflows/.github/workflows/check-alpine-support.yml@6793603145730d6d6900f0ceaab2b8daa6f507bd # v1.0.0
    permissions:
      contents: read
      issues: write
