name: Check base image support window

# The Dockerfile pins an Alpine branch rather than :latest, so upstream security
# patches still arrive automatically while a major version bump stays a
# deliberate act. The cost of that choice is that the pinned branch eventually
# leaves support, and nothing would otherwise say so.
#
# This belongs in CI rather than in a running container: the pinned branch is a
# property of the Dockerfile, which CI owns and the container cannot change.

on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve the pinned Alpine branch and its end-of-support date
        id: eol
        run: |
          set -euo pipefail

          FROM_LINE=$(grep -m1 '^FROM' Dockerfile)
          echo "from=$FROM_LINE" >> "$GITHUB_OUTPUT"

          # alpine:3.24 -> v3.24. Anything not pinned to a numeric branch is
          # out of scope: :latest and :edge have no support window to expire.
          VERSION=$(printf '%s' "$FROM_LINE" | sed -n 's|.*alpine:\([0-9][0-9.]*\).*|\1|p')
          if [ -z "$VERSION" ]; then
            echo "Base image is not pinned to a numbered Alpine branch; nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="v$(printf '%s' "$VERSION" | cut -d. -f1,2)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          EOL=$(curl -fsS --max-time 30 https://alpinelinux.org/releases.json \
            | jq -r --arg b "$BRANCH" '.release_branches[] | select(.rel_branch == $b) | .eol_date')

          if [ -z "$EOL" ] || [ "$EOL" = "null" ]; then
            echo "::warning::Could not determine an end-of-support date for $BRANCH"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eol=$EOL" >> "$GITHUB_OUTPUT"
          TODAY=$(date -u +%F)
          SOON=$(date -u -d '+180 days' +%F)
          echo "Pinned branch $BRANCH leaves support on $EOL (today $TODAY)"

          if [ "$EOL" \< "$TODAY" ]; then
            echo "state=expired" >> "$GITHUB_OUTPUT"
          elif [ "$EOL" \< "$SOON" ]; then
            echo "state=expiring" >> "$GITHUB_OUTPUT"
          else
            echo "state=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update a tracking issue
        if: steps.eol.outputs.skip != 'true' && steps.eol.outputs.state != 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.eol.outputs.branch }}
          EOL: ${{ steps.eol.outputs.eol }}
          STATE: ${{ steps.eol.outputs.state }}
          FROM_LINE: ${{ steps.eol.outputs.from }}
        run: |
          set -euo pipefail

          if [ "$STATE" = "expired" ]; then
            VERB="left support on"
          else
            VERB="leaves support on"
          fi

          TITLE="Base image: Alpine $BRANCH leaves support on $EOL"

          # Heredoc terminator must be unindented, so the body is built at
          # column zero rather than inside the YAML block's indentation.
          BODY=$(cat <<BODY_END
          \`$FROM_LINE\` pins Alpine **$BRANCH**, which $VERB **$EOL**.

          Once the branch is out of support it stops receiving security patches, so
          the daily base-image rebuild has nothing left to pull. The image keeps
          building successfully while quietly ceasing to be maintained, which is
          the failure this issue exists to prevent.

          Bump the \`FROM\` line in \`Dockerfile\` to a supported branch. Current
          branches and their dates: https://alpinelinux.org/releases/

          Raised automatically by \`.github/workflows/check-base-image-support.yml\`.
          BODY_END
          )

          # One issue per branch, reopened rather than duplicated.
          EXISTING=$(gh issue list --state all --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue reopen "$EXISTING" 2>/dev/null || true
            gh issue comment "$EXISTING" --body "Still applies as of $(date -u +%F)." 2>/dev/null || true
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail the run when the branch has already expired
        if: steps.eol.outputs.state == 'expired'
        run: |
          echo "::error::Alpine ${{ steps.eol.outputs.branch }} left support on ${{ steps.eol.outputs.eol }}"
          exit 1
