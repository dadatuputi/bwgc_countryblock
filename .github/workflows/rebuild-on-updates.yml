name: Rebuild when the base image or its packages change

# The check and the keepalive live in dadatuputi/bwgc_workflows, shared with
# the other bwgc_* image repositories; see check-for-updates.yml and
# keepalive.yml there for how each decides.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: dadatuputi/bwgc_workflows/.github/workflows/check-for-updates.yml@6793603145730d6d6900f0ceaab2b8daa6f507bd # v1.0.0

  build:
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    uses: ./.github/workflows/build-docker-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

  keepalive:
    # Only when nothing was rebuilt: a real build pushes and resets the clock
    # on its own, so this fires only during genuinely quiet stretches.
    needs: check
    if: needs.check.outputs.needs_build == 'false'
    uses: dadatuputi/bwgc_workflows/.github/workflows/keepalive.yml@6793603145730d6d6900f0ceaab2b8daa6f507bd # v1.0.0
    permissions:
      contents: write
