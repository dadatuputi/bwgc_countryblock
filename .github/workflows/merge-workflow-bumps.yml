name: Merge bwgc_workflows bumps

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    uses: dadatuputi/bwgc_workflows/.github/workflows/merge-workflow-bumps.yml@963cb5b625672614aa06cc2d28521a2cb54b7038 # v1.2.0
    with:
      pr-number: ${{ inputs.pr || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      checks: read
