name: Docker build image

# The build itself lives in dadatuputi/bwgc_workflows, shared with the other
# bwgc_* image repositories. This file keeps what is particular to this
# repository: when to build, and the inputs below.

on:
  push:
    branches: [ "master" ]
    # Only trigger on master when these paths change
    paths:
      - 'Dockerfile'
      - 'scripts/**'
    # Publish semver tags as releases.
    tags: [ 'v*' ]
  # Pull requests get the build and the test suite, but nothing is pushed,
  # scanned or signed: the token is read-only there, and nothing should be
  # published from a change that has not been merged.
  pull_request:
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-docker-image.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    uses: dadatuputi/bwgc_workflows/.github/workflows/build-image.yml@165cfe9ae2a7e781b53eb23f50a83042d5e6e8cd # unreleased, PR dadatuputi/bwgc_workflows#1
    with:
      test-image: bwgc_countryblock:test
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
