name: Docker build image

# The build itself lives in dadatuputi/bwgc_workflows, shared with the other
# bwgc_* image repositories. This file keeps what is particular to this
# repository: when to build, and the inputs below.

on:
  push:
    branches: [ "master" ]
    # Only trigger on master when these paths change
    paths:
      - 'Dockerfile'
      - 'scripts/**'
    # A vX.Y.Z tag publishes X, X.Y, X.Y.Z and latest.
    tags: [ 'v*' ]
  # Pull requests get the build and the test suite, but nothing is pushed,
  # scanned or signed: the token is read-only there, and nothing should be
  # published from a change that has not been merged.
  pull_request:
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-docker-image.yml'
  # The nightly rebuild calls this with ref set to the newest release, to
  # republish that release's tags with current packages.
  workflow_call:
    inputs:
      ref:
        description: Release tag (vX.Y.Z) to build instead of the triggering commit
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    uses: dadatuputi/bwgc_workflows/.github/workflows/build-image.yml@38f42c5731178d2fb116ba998b5a9098f0be8310 # v1.1.2
    with:
      test-image: bwgc_countryblock:test
      ref: ${{ inputs.ref }}
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
