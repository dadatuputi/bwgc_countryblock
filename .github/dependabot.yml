# Keeps the pinned actions, the shared bwgc_workflows reference and the
# Alpine base image current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Third-party action releases wait three days before Dependabot proposes
    # them, so a bad release has time to be noticed. Our own shared workflows
    # are exempt: a new bwgc_workflows tag is proposed right away.
    cooldown:
      default-days: 3
      exclude:
        - "dadatuputi/bwgc_workflows*"

  # The Dockerfile pins an Alpine branch (alpine:3.24). Security patches
  # within it arrive through the nightly rebuild; this proposes the next
  # branch (3.25 and on) as a reviewable pull request.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
